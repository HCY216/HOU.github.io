<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSMC 英文單字測驗 - 四選一升級版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #185FA5;
            --color-success: #639922;
            --color-danger: #E24B4A;
            --color-warning: #BA7517;
            --color-info: #378ADD;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F1EFE8;
            --bg-tertiary: #F9F8F6;
            --text-primary: #2C2C2A;
            --text-secondary: #888780;
            --text-tertiary: #B4B2A9;
            --border-color: rgba(95, 94, 90, 0.15);
            --border-color-secondary: rgba(95, 94, 90, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1A1A18;
                --bg-secondary: #2C2C2A;
                --bg-tertiary: #3C3C3A;
                --text-primary: #F1EFE8;
                --text-secondary: #D3D1C7;
                --text-tertiary: #888780;
                --border-color: rgba(241, 239, 232, 0.15);
                --border-color-secondary: rgba(241, 239, 232, 0.3);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        h3 {
            font-size: 28px;
            font-weight: 500;
            margin: 0.5rem 0;
            color: var(--text-primary);
            word-break: break-word;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        button {
            padding: 12px 24px;
            border: 0.5px solid var(--border-color-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            background: var(--bg-primary);
            color: var(--text-secondary);
        }

        button:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        button:active {
            transform: scale(0.98);
        }

        button.primary {
            background: var(--color-info);
            color: white;
            border-color: var(--color-info);
        }

        button.primary:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-color: var(--border-color-secondary);
            font-size: 13px;
            padding: 8px 16px;
        }

        .hidden {
            display: none;
        }

        .stage {
            display: none;
        }

        .stage.active {
            display: block;
        }

        .welcome-box {
            background: var(--bg-secondary);
            padding: 3rem 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .welcome-emoji {
            font-size: 48px;
            margin-bottom: 1rem;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .stats-overview {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 0.5px solid var(--border-color);
        }

        .stats-overview-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .stats-overview-row:last-child {
            margin-bottom: 0;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-item-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat-item-value {
            font-size: 20px;
            font-weight: 500;
            color: var(--color-info);
        }

        .features {
            text-align: left;
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 0.5px solid var(--border-color);
            font-size: 13px;
        }

        .features li {
            list-style: none;
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }

        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--color-success);
            font-weight: bold;
        }

        .button-group-welcome {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .button-group-welcome button {
            width: 100%;
            padding: 14px 24px;
            font-size: 16px;
        }

        .vocab-stats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .vocab-stat {
            background: var(--bg-primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            text-align: center;
            border: 0.5px solid var(--border-color);
        }

        .vocab-stat-number {
            font-size: 20px;
            font-weight: 500;
            color: var(--color-info);
        }

        .vocab-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 0.5px solid var(--border-color);
        }

        .stats {
            display: flex;
            gap: 1.5rem;
            font-size: 13px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: 500;
            color: var(--color-success);
        }

        .stat-value.info {
            color: var(--color-info);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-info);
            transition: width 0.3s;
        }

        .question-box {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .question-type {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .word-pos {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            padding: 12px;
            border: 1px solid var(--border-color-secondary);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: var(--color-info);
            background: var(--bg-secondary);
        }

        .option-btn.selected {
            border-color: var(--color-info);
            background: var(--color-info);
            color: white;
        }

        .option-btn.correct {
            border-color: var(--color-success);
            background: var(--color-success);
            color: white;
        }

        .option-btn.incorrect {
            border-color: var(--color-danger);
            background: var(--color-danger);
            color: white;
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .feedback {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 14px;
            font-weight: 500;
        }

        .feedback.correct {
            background: rgba(99, 153, 34, 0.1);
            color: var(--color-success);
        }

        .feedback.incorrect {
            background: rgba(226, 75, 74, 0.1);
            color: var(--color-danger);
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .button-group button {
            flex: 1;
        }

        .summary {
            text-align: center;
        }

        .summary h2 {
            font-size: 24px;
            margin-bottom: 0.5rem;
        }

        .summary-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .stat-card-value {
            font-size: 28px;
            font-weight: 500;
            margin: 0;
            color: var(--color-success);
        }

        .stat-card-value.info {
            color: var(--color-info);
        }

        .evaluation-box {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .evaluation-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .evaluation-message {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .wrong-answers-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 2rem;
            border: 0.5px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .wrong-item {
            padding: 1rem;
            margin-bottom: 0.75rem;
            background: rgba(226, 75, 74, 0.1);
            border-left: 3px solid var(--color-danger);
            border-radius: 6px;
            text-align: left;
        }

        .wrong-item-header {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .wrong-item-pos {
            font-size: 12px;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 0.25rem;
        }

        .wrong-item-type {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .wrong-item-your {
            font-size: 12px;
            color: var(--color-danger);
            margin-bottom: 0.25rem;
        }

        .wrong-item-correct {
            font-size: 12px;
            color: var(--color-success);
            font-weight: 500;
        }

        .wrong-count-badge {
            display: inline-block;
            background: var(--color-danger);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 0.5rem;
            font-weight: 500;
        }

        .history-item {
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            background: var(--bg-secondary);
            border-left: 3px solid var(--color-warning);
            border-radius: 6px;
            text-align: left;
            font-size: 12px;
        }

        .history-item-header {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .history-item-pos {
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 0.25rem;
        }

        .history-item-count {
            font-weight: 500;
            color: var(--color-danger);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0;
            min-width: auto;
        }

        .clear-data-btn {
            background: var(--color-danger);
            color: white;
            border-color: var(--color-danger);
            margin-top: 1rem;
        }

        .clear-data-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Welcome Stage -->
        <div id="welcomeStage" class="stage active">
            <h1>TSMC 英文單字測驗</h1>
            
            <div class="welcome-box">
                <div class="welcome-emoji">📚</div>
                <h2 class="welcome-title">四選一升級版</h2>
                <p class="welcome-subtitle">隨機 20 題，智能出題</p>
                
                <div class="stats-overview">
                    <div class="stats-overview-row">
                        <div class="stat-item">
                            <span class="stat-item-label">累計測驗次數</span>
                            <span class="stat-item-value" id="totalQuizzes">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-item-label">歷史錯題數</span>
                            <span class="stat-item-value" id="totalWrongQuestions">0</span>
                        </div>
                    </div>
                </div>

                <ul class="features">
                    <li>四選一選擇題</li>
                    <li>顯示詞性 (n./v./adj. 等)</li>
                    <li>選項多樣不重複</li>
                    <li>記錄測驗歷史</li>
                </ul>

                <div class="vocab-stats">
                    <div class="vocab-stat">
                        <div class="vocab-stat-number">288</div>
                        <div class="vocab-stat-label">總單字數</div>
                    </div>
                    <div class="vocab-stat">
                        <div class="vocab-stat-number">20</div>
                        <div class="vocab-stat-label">每次題數</div>
                    </div>
                </div>

                <div class="button-group-welcome">
                    <button class="primary" onclick="startQuiz()">開始測驗</button>
                    <button class="secondary" onclick="showHistory()">📊 查看歷史</button>
                </div>
            </div>
        </div>

        <!-- Quiz Stage -->
        <div id="quizStage" class="stage">
            <div class="header">
                <h2 id="questionNumber">第 1 / 20 題</h2>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">得分：</span>
                        <span class="stat-value"><span id="currentScore">0</span>/20</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">準確率：</span>
                        <span class="stat-value info"><span id="accuracy">0</span>%</span>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
            </div>

            <div class="question-box">
                <p class="question-type" id="questionType">英文 → 中文</p>
                <h3 id="question">Question</h3>
                <p class="word-pos" id="wordPos"></p>
            </div>

            <div class="options" id="optionsContainer"></div>

            <div id="feedbackBox" class="feedback hidden"></div>

            <div class="button-group">
                <button id="submitBtn" class="primary" onclick="submitAnswer()" style="display: none;">確認答案</button>
                <button onclick="resetQuiz()">返回</button>
            </div>
        </div>

        <!-- Summary Stage -->
        <div id="summaryStage" class="stage">
            <div class="summary">
                <h2>測驗完成！</h2>
                <p class="summary-subtitle">20 題測驗結果</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-label">總分</div>
                    <p class="stat-card-value"><span id="finalScore">0</span>/20</p>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">準確率</div>
                    <p class="stat-card-value info"><span id="finalAccuracy">0</span>%</p>
                </div>
            </div>

            <div class="evaluation-box">
                <p class="evaluation-title" id="evaluationTitle">🌟 優秀！</p>
                <p class="evaluation-message" id="evaluationMessage">你掌握了大部分的單字！</p>
            </div>

            <div id="wrongAnswersSection" class="hidden">
                <p class="section-title">
                    ❌ 本次錯誤題目 
                    <span class="wrong-count-badge" id="wrongCount">0</span>
                </p>
                <div class="wrong-answers-list" id="wrongAnswersList"></div>
            </div>

            <div class="button-group">
                <button class="primary" onclick="retakeQuiz()">重新測驗</button>
                <button onclick="resetQuiz()">返回首頁</button>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">📊 測驗歷史</h2>
                <button class="modal-close" onclick="closeHistory()">✕</button>
            </div>

            <div style="margin-bottom: 1.5rem; padding: 1rem; background: var(--bg-secondary); border-radius: 8px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 0.5rem;">累計測驗次數</div>
                        <div style="font-size: 24px; font-weight: 500; color: var(--color-info);" id="historyTotalQuizzes">0</div>
                    </div>
                    <div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 0.5rem;">累計錯題數</div>
                        <div style="font-size: 24px; font-weight: 500; color: var(--color-danger);" id="historyTotalWrong">0</div>
                    </div>
                </div>
            </div>

            <p class="section-title">常錯題目排行 (按錯誤次數)</p>
            <div id="historyList" style="max-height: 400px; overflow-y: auto;">
                <p style="color: var(--text-secondary); text-align: center;">暫無錯題記錄</p>
            </div>

            <button class="clear-data-btn" onclick="confirmClearData()">🗑️ 清空所有數據</button>
        </div>
    </div>

    <script>

                'beau', 'beauty', 'beaver', 'became', 'become', 'bedaub', 'bedding', 'bedlam',

            {english: "warning", chinese: "警告", pos: "n."},
            {english: "weekly", chinese: "每週地", pos: "adv."},
            {english: "wet", chinese: "濕的", pos: "a."},
            {english: "window", chinese: "視窗", pos: "n."},

        ];

        // State
        let currentStage = 'welcome';
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answers = [];
        let selectedOption = null;
        let wrongAnswers = {};

        // LocalStorage 功能
        function initializeStats() {
            const stats = localStorage.getItem('quizStats');
            if (!stats) {
                localStorage.setItem('quizStats', JSON.stringify({
                    totalQuizzes: 0,
                    historyWrongQuestions: {}
                }));
            }
            updateStatsDisplay();
        }

        function saveQuizResult() {
            const stats = JSON.parse(localStorage.getItem('quizStats'));
            stats.totalQuizzes++;

            // 保存本次答錯的題目到歷史記錄
            for (const [key, wrongItem] of Object.entries(wrongAnswers)) {
                if (!stats.historyWrongQuestions[key]) {
                    stats.historyWrongQuestions[key] = {
                        question: wrongItem.question,
                        word: wrongItem.word,
                        pos: wrongItem.pos,
                        type: wrongItem.type,
                        correctAnswer: wrongItem.correctAnswer,
                        wrongCount: 0
                    };
                }
                stats.historyWrongQuestions[key].wrongCount += wrongItem.count;
            }

            localStorage.setItem('quizStats', JSON.stringify(stats));
            updateStatsDisplay();
        }

        function updateStatsDisplay() {
            const stats = JSON.parse(localStorage.getItem('quizStats'));
            document.getElementById('totalQuizzes').textContent = stats.totalQuizzes;
            document.getElementById('totalWrongQuestions').textContent = Object.keys(stats.historyWrongQuestions).length;
        }

        function getRandomWrongAnswers(correctAnswer, correctChinese, isEnglishToChina, count = 3) {
            const answers = [];
            const usedWords = new Set([correctAnswer, correctChinese]);
            
            if (isEnglishToChina) {
                const vocabChineseCopy = [...builtInVocab].sort(() => Math.random() - 0.5);
                for (let vocab of vocabChineseCopy) {
                    if (answers.length >= count) break;
                    if (!usedWords.has(vocab.chinese) && vocab.chinese !== correctChinese) {
                        answers.push(vocab.chinese);
                        usedWords.add(vocab.chinese);
                    }
                }
                
                while (answers.length < count) {
                    const randomIdx = Math.floor(Math.random() * distractorWords.chinese.length);
                    const fakeChinese = distractorWords.chinese[randomIdx];
                    if (!usedWords.has(fakeChinese)) {
                        answers.push(fakeChinese);
                        usedWords.add(fakeChinese);
                    }
                }
            } else {
                const vocabEnglishCopy = [...builtInVocab].sort(() => Math.random() - 0.5);
                for (let vocab of vocabEnglishCopy) {
                    if (answers.length >= count) break;
                    if (vocab.english !== correctAnswer && !usedWords.has(vocab.english)) {
                        answers.push(vocab.english);
                        usedWords.add(vocab.english);
                    }
                }
                
                while (answers.length < count) {
                    const randomIdx = Math.floor(Math.random() * distractorWords.english.length);
                    const fakeEnglish = distractorWords.english[randomIdx];
                    if (!usedWords.has(fakeEnglish)) {
                        answers.push(fakeEnglish);
                        usedWords.add(fakeEnglish);
                    }
                }
            }
            
            return answers;
        }

        function generateQuiz(vocab) {
            const shuffled = [...vocab].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, 20);
            
            return selected.map(vocab => {
                const isEnglishToChina = Math.random() > 0.5;
                const question = isEnglishToChina ? vocab.english : vocab.chinese;
                const correctAnswer = isEnglishToChina ? vocab.chinese : vocab.english;
                
                let options = [correctAnswer];
                options = options.concat(getRandomWrongAnswers(vocab.english, vocab.chinese, isEnglishToChina, 3));
                
                options = options.sort(() => Math.random() - 0.5);
                
                return {
                    vocab,
                    isEnglishToChina,
                    question,
                    correctAnswer,
                    options
                };
            });
        }

        function startQuiz() {
            questions = generateQuiz(builtInVocab);
            score = 0;
            currentQuestionIndex = 0;
            answers = [];
            wrongAnswers = {};
            selectedOption = null;

            displayQuestion();
            setStage('quiz');
        }

        function displayQuestion() {
            const q = questions[currentQuestionIndex];
            const progress = currentQuestionIndex + 1;

            document.getElementById('questionNumber').textContent = `第 ${progress} / 20 題`;
            document.getElementById('currentScore').textContent = score;
            
            const accuracy = currentQuestionIndex > 0 ? Math.round((score / currentQuestionIndex) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy;

            document.getElementById('progressFill').style.width = `${(progress / 20) * 100}%`;
            document.getElementById('questionType').textContent = q.isEnglishToChina ? '英文 → 中文' : '中文 → 英文';
            document.getElementById('question').textContent = q.question;
            document.getElementById('wordPos').textContent = `(${q.vocab.pos})`;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((option, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => selectOption(idx, option);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('feedbackBox').classList.add('hidden');
            document.getElementById('submitBtn').style.display = 'none';
            selectedOption = null;
        }

        function selectOption(index, answer) {
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            document.querySelectorAll('.option-btn')[index].classList.add('selected');
            selectedOption = { index, answer };
            
            checkAnswer(answer);
        }

        function checkAnswer(userAnswer) {
            const q = questions[currentQuestionIndex];
            const isCorrect = userAnswer === q.correctAnswer;

            if (isCorrect) {
                score++;
                document.querySelectorAll('.option-btn')[selectedOption.index].classList.add('correct');
            } else {
                document.querySelectorAll('.option-btn')[selectedOption.index].classList.add('incorrect');
                const correctIndex = q.options.indexOf(q.correctAnswer);
                document.querySelectorAll('.option-btn')[correctIndex].classList.add('correct');
                
                const key = `${q.question}`;
                if (!wrongAnswers[key]) {
                    wrongAnswers[key] = {
                        question: q.question,
                        word: q.vocab.english,
                        pos: q.vocab.pos,
                        type: q.isEnglishToChina ? '英文 → 中文' : '中文 → 英文',
                        userAnswer: userAnswer,
                        correctAnswer: q.correctAnswer,
                        count: 0
                    };
                }
                wrongAnswers[key].count++;
            }

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.classList.remove('hidden');
            feedbackBox.classList.remove('correct', 'incorrect');
            feedbackBox.classList.add(isCorrect ? 'correct' : 'incorrect');
            
            if (isCorrect) {
                feedbackBox.textContent = '✓ 正確！';
            } else {
                feedbackBox.textContent = `✗ 錯誤。正確答案是：${q.correctAnswer}`;
            }

            answers.push({
                question: q.question,
                userAnswer,
                correctAnswer: q.correctAnswer,
                isCorrect
            });

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
            });

            if (currentQuestionIndex === 19) {
                document.getElementById('submitBtn').textContent = '查看結果 →';
            } else {
                document.getElementById('submitBtn').textContent = '下一題 →';
            }
            document.getElementById('submitBtn').style.display = 'block';
        }

        function submitAnswer() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            const accuracy = Math.round((score / 20) * 100);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalAccuracy').textContent = accuracy;

            let evaluation = '';
            let message = '';
            let color = '';

            if (score >= 18) {
                evaluation = '🌟 優秀！';
                message = '你掌握了大部分的單字！';
                color = 'var(--color-success)';
            } else if (score >= 14) {
                evaluation = '👍 很好！';
                message = '繼續加強，你會變得更強！';
                color = 'var(--color-info)';
            } else if (score >= 10) {
                evaluation = '💪 加油！';
                message = '多練習幾次，一定能進步！';
                color = 'var(--color-warning)';
            } else {
                evaluation = '📚 繼續努力！';
                message = '別灰心，多背幾次就會記住！';
                color = 'var(--color-danger)';
            }

            const evalTitle = document.getElementById('evaluationTitle');
            evalTitle.textContent = evaluation;
            evalTitle.style.color = color;
            document.getElementById('evaluationMessage').textContent = message;

            const wrongList = Object.values(wrongAnswers);
            if (wrongList.length > 0) {
                document.getElementById('wrongCount').textContent = wrongList.length;
                document.getElementById('wrongAnswersSection').classList.remove('hidden');
                
                const wrongListContainer = document.getElementById('wrongAnswersList');
                wrongListContainer.innerHTML = '';
                
                wrongList.sort((a, b) => b.count - a.count);
                
                wrongList.forEach(wrong => {
                    const item = document.createElement('div');
                    item.className = 'wrong-item';
                    
                    const header = document.createElement('div');
                    header.className = 'wrong-item-header';
                    header.textContent = wrong.question;
                    
                    const pos = document.createElement('div');
                    pos.className = 'wrong-item-pos';
                    pos.textContent = `${wrong.word} (${wrong.pos})`;
                    
                    const type = document.createElement('div');
                    type.className = 'wrong-item-type';
                    type.textContent = `題型：${wrong.type}`;
                    
                    const userAns = document.createElement('div');
                    userAns.className = 'wrong-item-your';
                    userAns.textContent = `你的答案：${wrong.userAnswer}`;
                    
                    const correct = document.createElement('div');
                    correct.className = 'wrong-item-correct';
                    correct.textContent = `正確答案：${wrong.correctAnswer}`;
                    
                    if (wrong.count > 1) {
                        const countBadge = document.createElement('span');
                        countBadge.className = 'wrong-count-badge';
                        countBadge.textContent = `${wrong.count}次`;
                        correct.appendChild(countBadge);
                    }
                    
                    item.appendChild(header);
                    item.appendChild(pos);
                    item.appendChild(type);
                    item.appendChild(userAns);
                    item.appendChild(correct);
                    wrongListContainer.appendChild(item);
                });
            } else {
                document.getElementById('wrongAnswersSection').classList.add('hidden');
            }

            // 保存測驗結果到localStorage
            saveQuizResult();

            setStage('summary');
        }

        function retakeQuiz() {
            startQuiz();
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            answers = [];
            wrongAnswers = {};
            selectedOption = null;
            setStage('welcome');
        }

        function showHistory() {
            const stats = JSON.parse(localStorage.getItem('quizStats'));
            document.getElementById('historyTotalQuizzes').textContent = stats.totalQuizzes;
            document.getElementById('historyTotalWrong').textContent = Object.keys(stats.historyWrongQuestions).length;

            const historyList = document.getElementById('historyList');
            const wrongQuestions = Object.values(stats.historyWrongQuestions);

            if (wrongQuestions.length === 0) {
                historyList.innerHTML = '<p style="color: var(--text-secondary); text-align: center;">暫無錯題記錄</p>';
            } else {
                wrongQuestions.sort((a, b) => b.wrongCount - a.wrongCount);
                historyList.innerHTML = '';

                wrongQuestions.forEach(wrong => {
                    const item = document.createElement('div');
                    item.className = 'history-item';

                    const header = document.createElement('div');
                    header.className = 'history-item-header';
                    header.textContent = wrong.question;

                    const pos = document.createElement('div');
                    pos.className = 'history-item-pos';
                    pos.textContent = `${wrong.word} (${wrong.pos})`;

                    const count = document.createElement('div');
                    count.className = 'history-item-count';
                    count.textContent = `錯誤 ${wrong.wrongCount} 次 | 正確答案：${wrong.correctAnswer}`;

                    item.appendChild(header);
                    item.appendChild(pos);
                    item.appendChild(count);
                    historyList.appendChild(item);
                });
            }

            document.getElementById('historyModal').classList.add('active');
        }

        function closeHistory() {
            document.getElementById('historyModal').classList.remove('active');
        }

        function confirmClearData() {
            if (confirm('確定要清空所有測驗數據嗎？此操作無法復原。')) {
                localStorage.setItem('quizStats', JSON.stringify({
                    totalQuizzes: 0,
                    historyWrongQuestions: {}
                }));
                updateStatsDisplay();
                closeHistory();
                alert('所有數據已清空');
            }
        }

        function setStage(stage) {
            document.getElementById('welcomeStage').classList.remove('active');
            document.getElementById('quizStage').classList.remove('active');
            document.getElementById('summaryStage').classList.remove('active');

            if (stage === 'welcome') {
                document.getElementById('welcomeStage').classList.add('active');
                updateStatsDisplay();
            } else if (stage === 'quiz') {
                document.getElementById('quizStage').classList.add('active');
            } else if (stage === 'summary') {
                document.getElementById('summaryStage').classList.add('active');
            }
            currentStage = stage;
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeStats();
        });
