            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-primary: #185FA5;
            --color-success: #639922;
            --color-danger: #E24B4A;
            --color-warning: #BA7517;
            --color-info: #378ADD;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F1EFE8;
            --bg-tertiary: #F9F8F6;
            --text-primary: #2C2C2A;
            --text-secondary: #888780;
            --text-tertiary: #B4B2A9;
            --border-color: rgba(95, 94, 90, 0.15);
            --border-color-secondary: rgba(95, 94, 90, 0.3);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1A1A18;
                --bg-secondary: #2C2C2A;
                --bg-tertiary: #3C3C3A;
                --text-primary: #F1EFE8;
                --text-secondary: #D3D1C7;
                --text-tertiary: #888780;
                --border-color: rgba(241, 239, 232, 0.15);
                --border-color-secondary: rgba(241, 239, 232, 0.3);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        h2 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        h3 {
            font-size: 32px;
            font-weight: 500;
            margin: 0.5rem 0;
            color: var(--text-primary);
            word-break: break-word;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 0.5px solid var(--border-color-secondary);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-primary);
            background: var(--bg-primary);
            margin-bottom: 1.5rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        input[type="text"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button {
            padding: 12px 24px;
            border: 0.5px solid var(--border-color-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            background: var(--bg-primary);
            color: var(--text-secondary);
        }

        button:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        button:active {
            transform: scale(0.98);
        }

        button.primary {
            background: var(--color-info);
            color: white;
            border-color: var(--color-info);
        }

        button.primary:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none;
        }

        .stage {
            display: none;
        }

        .stage.active {
            display: block;
        }

        .welcome-box {
            background: var(--bg-secondary);
            padding: 3rem 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .welcome-emoji {
            font-size: 48px;
            margin-bottom: 1rem;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .vocab-stats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .vocab-stat {
            background: var(--bg-primary);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            text-align: center;
            border: 0.5px solid var(--border-color);
        }

        .vocab-stat-number {
            font-size: 20px;
            font-weight: 500;
            color: var(--color-info);
        }

        .vocab-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 0.5px solid var(--border-color);
        }

        .stats {
            display: flex;
            gap: 1.5rem;
            font-size: 13px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: 500;
            color: var(--color-success);
        }

        .stat-value.info {
            color: var(--color-info);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-info);
            transition: width 0.3s;
        }

        .question-box {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .question-type {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .feedback {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 14px;
            font-weight: 500;
        }

        .feedback.correct {
            background: rgba(99, 153, 34, 0.1);
            color: var(--color-success);
        }

        .feedback.incorrect {
            background: rgba(226, 75, 74, 0.1);
            color: var(--color-danger);
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .button-group button {
            flex: 1;
        }

        .summary {
            text-align: center;
        }

        .summary h2 {
            font-size: 24px;
            margin-bottom: 0.5rem;
        }

        .summary-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .stat-card-value {
            font-size: 28px;
            font-weight: 500;
            margin: 0;
            color: var(--color-success);
        }

        .stat-card-value.info {
            color: var(--color-info);
        }

        .evaluation-box {
            background: var(--bg-secondary);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .evaluation-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .evaluation-message {
            font-size: 13px;
            color: var(--text-secondary);
        }

            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 2rem;
            border: 0.5px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
        }

        .answer-item {
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            border-left: 3px solid;
            font-size: 12px;
        }

        .answer-item.correct {
            background: rgba(99, 153, 34, 0.1);
            border-left-color: var(--color-success);
        }

        .answer-item.incorrect {
            background: rgba(226, 75, 74, 0.1);
            border-left-color: var(--color-danger);
        }

        .answer-status {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .answer-status.correct {
            color: var(--color-success);
        }

        .answer-status.incorrect {
            color: var(--color-danger);
        }

        .answer-question {
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .answer-user {
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .answer-correct {
            font-weight: 500;
        }

        .answer-correct.correct {
            color: var(--color-success);
        }

        .answer-correct.incorrect {
            color: var(--color-danger);
        }

</head>
<body>
    <div class="container">
        <!-- Welcome Stage -->
        <div id="welcomeStage" class="stage active">
            <h1>TSMC 英文單字測驗</h1>
            
            <div class="welcome-box">
                <div class="welcome-emoji">📚</div>
                <h2 class="welcome-title">準備好了嗎？</h2>
                <p class="welcome-subtitle">隨機 20 題，英翻中與中翻英交替出題</p>
                
                <div class="vocab-stats">
                    <div class="vocab-stat">
                        <div class="vocab-stat-number">288</div>
                        <div class="vocab-stat-label">總單字數</div>
                    </div>
                    <div class="vocab-stat">
                        <div class="vocab-stat-number">20</div>
                        <div class="vocab-stat-label">每次題數</div>
                    </div>
                </div>

                <button class="primary" onclick="startQuiz()" style="width: 100%; padding: 14px 24px; font-size: 16px;">
                    開始測驗
                </button>
            </div>
        </div>

        <!-- Quiz Stage -->
        <div id="quizStage" class="stage">
            <div class="header">
                <h2 id="questionNumber">第 1 / 20 題</h2>
                <div class="stats">
                    <div class="stat">
                        <span class="stat-label">得分：</span>
                        <span class="stat-value"><span id="currentScore">0</span>/20</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">準確率：</span>
                        <span class="stat-value info"><span id="accuracy">0</span>%</span>
                    </div>
                </div>
            </div>

            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
            </div>

            <div class="question-box">
                <p class="question-type" id="questionType">英文 → 中文</p>
                <h3 id="question">Question</h3>
            </div>

            <input type="text" id="answerInput" placeholder="輸入你的答案..." onkeypress="handleKeyPress(event)">

            <div id="feedbackBox" class="feedback hidden"></div>

            <div class="button-group">
                <button id="submitBtn" class="primary" onclick="checkAnswer()">確認答案</button>
                <button onclick="resetQuiz()">返回</button>
            </div>
        </div>

        <!-- Summary Stage -->
        <div id="summaryStage" class="stage">
            <div class="summary">
                <h2>測驗完成！</h2>
                <p class="summary-subtitle">20 題測驗結果</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-label">總分</div>
                    <p class="stat-card-value"><span id="finalScore">0</span>/20</p>
                </div>
                <div class="stat-card">
                    <div class="stat-card-label">準確率</div>
                    <p class="stat-card-value info"><span id="finalAccuracy">0</span>%</p>
                </div>
            </div>

            <div class="evaluation-box">
                <p class="evaluation-title" id="evaluationTitle">🌟 優秀！</p>
                <p class="evaluation-message" id="evaluationMessage">你掌握了大部分的單字！</p>
            </div>

            <div class="answers-list" id="answersList"></div>

            <div class="button-group">
                <button class="primary" onclick="retakeQuiz()">重新測驗</button>
                <button onclick="resetQuiz()">返回首頁</button>
            </div>
        </div>
    </div>

        // State
        let currentStage = 'welcome';
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answers = [];
        let showingResult = false;

        function generateQuiz(vocab) {
            const shuffled = [...vocab].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, 20);
            
            return selected.map(vocab => ({
                vocab,
                isEnglishToChina: Math.random() > 0.5,
                question: Math.random() > 0.5 ? vocab.english : vocab.chinese,
                answer: Math.random() > 0.5 ? vocab.chinese : vocab.english
            }));
        }

        function startQuiz() {
            questions = generateQuiz(builtInVocab);
            score = 0;
            currentQuestionIndex = 0;
            answers = [];
            showingResult = false;

            displayQuestion();
            setStage('quiz');
        }

        function displayQuestion() {
            const q = questions[currentQuestionIndex];
            const progress = currentQuestionIndex + 1;

            document.getElementById('questionNumber').textContent = `第 ${progress} / 20 題`;
            document.getElementById('currentScore').textContent = score;
            
            const accuracy = currentQuestionIndex > 0 ? Math.round((score / currentQuestionIndex) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy;

            document.getElementById('progressFill').style.width = `${(progress / 20) * 100}%`;
            document.getElementById('questionType').textContent = q.isEnglishToChina ? '英文 → 中文' : '中文 → 英文';
            document.getElementById('question').textContent = q.question;

            document.getElementById('answerInput').value = '';
            document.getElementById('feedbackBox').classList.add('hidden');
            document.getElementById('answerInput').disabled = false;
            document.getElementById('submitBtn').textContent = '確認答案';
            showingResult = false;

            document.getElementById('answerInput').focus();
        }

        function checkAnswer() {
            if (showingResult) {
                nextQuestion();
                return;
            }

            const userAnswer = document.getElementById('answerInput').value.trim();
            if (!userAnswer) {
                alert('請輸入答案');
                return;
            }

            const q = questions[currentQuestionIndex];
            const normalizedUser = userAnswer.toLowerCase();
            const normalizedCorrect = q.answer.trim().toLowerCase();
            const isCorrect = normalizedUser === normalizedCorrect;

            if (isCorrect) {
                score++;
            }

            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.classList.remove('hidden');
            feedbackBox.classList.remove('correct', 'incorrect');
            feedbackBox.classList.add(isCorrect ? 'correct' : 'incorrect');
            feedbackBox.textContent = isCorrect 
                ? '✓ 正確！' 
                : `✗ 錯誤。正確答案是：${q.answer}`;

            answers.push({
                question: q.question,
                userAnswer,
                correctAnswer: q.answer,
                isCorrect
            });

            document.getElementById('answerInput').disabled = true;
            document.getElementById('submitBtn').textContent = currentQuestionIndex === 19 ? '查看結果 →' : '下一題 →';
            showingResult = true;
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                showSummary();
            }
        }

        function showSummary() {
            const accuracy = Math.round((score / 20) * 100);
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalAccuracy').textContent = accuracy;

            let evaluation = '';
            let message = '';
            let color = '';

            if (score >= 18) {
                evaluation = '🌟 優秀！';
                message = '你掌握了大部分的單字！';
                color = 'var(--color-success)';
            } else if (score >= 14) {
                evaluation = '👍 很好！';
                message = '繼續加強，你會變得更強！';
                color = 'var(--color-info)';
            } else if (score >= 10) {
                evaluation = '💪 加油！';
                message = '多練習幾次，一定能進步！';
                color = 'var(--color-warning)';
            } else {
                evaluation = '📚 繼續努力！';
                message = '別灰心，多背幾次就會記住！';
                color = 'var(--color-danger)';
            }

            const evalTitle = document.getElementById('evaluationTitle');
            evalTitle.textContent = evaluation;
            evalTitle.style.color = color;
            document.getElementById('evaluationMessage').textContent = message;

            const answersList = document.getElementById('answersList');
            answersList.innerHTML = '';
            
            const title = document.createElement('p');
            title.style.fontSize = '13px';
            title.style.fontWeight = '500';
            title.style.color = 'var(--text-primary)';
            title.style.marginBottom = '1rem';
            title.textContent = '詳細答案';
            answersList.appendChild(title);

            answers.forEach(ans => {
                const item = document.createElement('div');
                item.className = `answer-item ${ans.isCorrect ? 'correct' : 'incorrect'}`;

                const status = document.createElement('p');
                status.className = `answer-status ${ans.isCorrect ? 'correct' : 'incorrect'}`;
                status.textContent = ans.isCorrect ? '✓ 正確' : '✗ 錯誤';

                const question = document.createElement('p');
                question.className = 'answer-question';
                question.textContent = `題目：${ans.question}`;

                const content = [status, question];

                if (!ans.isCorrect) {
                    const userAns = document.createElement('p');
                    userAns.className = 'answer-user';
                    userAns.textContent = `你的答案：${ans.userAnswer}`;
                    content.push(userAns);
                }

                const correct = document.createElement('p');
                correct.className = `answer-correct ${ans.isCorrect ? 'correct' : 'incorrect'}`;
                correct.textContent = `正確答案：${ans.correctAnswer}`;
                content.push(correct);

                content.forEach(el => item.appendChild(el));
                answersList.appendChild(item);
            });

            setStage('summary');
        }

        function retakeQuiz() {
            questions = generateQuiz(builtInVocab);
            score = 0;
            currentQuestionIndex = 0;
            answers = [];
            showingResult = false;
            displayQuestion();
            setStage('quiz');
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            answers = [];
            showingResult = false;
            setStage('welcome');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                if (showingResult) {
                    nextQuestion();
                } else {
                    checkAnswer();
                }
            }
        }

        function setStage(stage) {
            document.getElementById('welcomeStage').classList.remove('active');
            document.getElementById('quizStage').classList.remove('active');
            document.getElementById('summaryStage').classList.remove('active');

            if (stage === 'welcome') {
                document.getElementById('welcomeStage').classList.add('active');
            } else if (stage === 'quiz') {
                document.getElementById('quizStage').classList.add('active');
            } else if (stage === 'summary') {
                document.getElementById('summaryStage').classList.add('active');
            }
            currentStage = stage;
        }
    </script>
